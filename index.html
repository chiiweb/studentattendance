<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css" />
  <script src="firebase-config.js"></script>
  <style>
    /* Extra mobile double-tap context menu simulation - visual feedback */
    .mobile-context-triggered {
      animation: contextFlash 0.2s ease-out;
    }
    @keyframes contextFlash {
      0% { background-color: rgba(0,0,0,0.05); }
      100% { background-color: transparent; }
    }
    /* Improved touch targets for mobile */
    @media (max-width: 768px) {
      .nav-item, .status-btn, .btn, .student-row, .roster-row, .class-card {
        cursor: pointer;
        touch-action: manipulation;
      }
      .student-avatar-large, .student-avatar-small {
        cursor: pointer;
      }
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div class="login-screen" id="login-screen" style="display:none"></div>

  <!-- Main App -->
  <div class="layout" id="app-layout" style="display:none">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <div>
          <div class="brand-title" id="brand-title-el">Classroom</div>
          <div class="brand-sub" id="brand-sub-el">Attendance Tracker</div>
        </div>
      </div>

      <div class="class-switcher" id="class-switcher" style="display:none">
        <div class="class-switcher-label">Current Class</div>
        <button class="class-switcher-btn" id="class-switcher-btn">
          <span id="class-switcher-name">—</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-page="attendance">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          <span>Attendance</span>
        </button>
        <button class="nav-item" data-page="roster">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          <span>Roster</span>
        </button>
        <button class="nav-item" data-page="summary">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Summary</span>
        </button>
        <button class="nav-item" data-page="classes">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>My Classes</span>
        </button>
        <button class="nav-item" data-page="chat">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          <span>Chat</span>
          <span class="chat-badge" id="chat-badge" style="display:none"></span>
        </button>
        <div class="nav-spacer"></div>
        <button class="nav-item" data-page="settings">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span>Settings</span>
        </button>
        <button class="nav-item" id="logout-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Sign Out</span>
        </button>
      </nav>
    </aside>

    <main class="main" id="main">
      <div class="loading-full"><div class="spinner"></div></div>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- Modals -->
  <div class="modal-overlay" id="modal-add-student" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Add Student</h2>
        <button class="modal-close" onclick="window.closeAddModal && closeAddModal()">&times;</button>
      </div>
      <form id="add-student-form">
        <div class="form-group">
          <label class="form-label">Name <span style="color:var(--red)">*</span></label>
          <input type="text" id="student-name" class="form-input" placeholder="e.g. Emma Johnson" required>
        </div>
        <div class="form-group">
          <label class="form-label">Grade</label>
          <input type="text" id="student-grade" class="form-input" placeholder="e.g. 3rd Grade">
        </div>
        <div class="form-group">
          <label class="form-label">Notes</label>
          <input type="text" id="student-notes" class="form-input" placeholder="Optional notes">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="window.closeAddModal && closeAddModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Student</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="modal-set-login" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Set Login</h2>
        <button class="modal-close" onclick="document.getElementById('modal-set-login').style.display='none'">&times;</button>
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="set-login-username" class="form-input" placeholder="Choose a username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="set-login-password" class="form-input" placeholder="Choose a password">
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="document.getElementById('modal-set-login').style.display='none'">Cancel</button>
        <button class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-add-class" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Create New Class</h2>
        <button class="modal-close" onclick="window.closeClassModal && closeClassModal()">&times;</button>
      </div>
      <form id="add-class-form">
        <div class="form-group">
          <label class="form-label">Class Name <span style="color:var(--red)">*</span></label>
          <input type="text" id="new-class-name" class="form-input" placeholder="e.g. Mrs. Smith's Class" required>
        </div>
        <div class="form-group">
          <label class="form-label">School Name</label>
          <input type="text" id="new-class-school" class="form-input" placeholder="e.g. Lincoln Elementary">
        </div>
        <div class="form-group">
          <label class="form-label">Grade</label>
          <input type="text" id="new-class-grade" class="form-input" placeholder="e.g. 3rd Grade">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="window.closeClassModal && closeClassModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Class</button>
        </div>
      </form>
    </div>
  </div>
  
  <div class="modal-overlay" id="modal-birthday" style="display:none">
    <div class="modal" style="text-align:center;padding:32px;">
      <div style="font-size:64px;margin-bottom:16px;">🎂</div>
      <div id="birthday-message" style="font-size:18px;font-weight:700;color:var(--text);line-height:1.6;"></div>
      <button class="btn btn-primary" style="margin-top:24px;" onclick="document.getElementById('modal-birthday').style.display='none'">🎉 Yay!</button>
    </div>
  </div>

  <div class="modal-overlay" id="modal-banner" style="display:none">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2 class="modal-title">🎨 Choose a Banner</h2>
        <button class="modal-close" id="banner-close-btn">&times;</button>
      </div>
      <div class="banner-grid" id="banner-modal-grid" style="padding:16px;"></div>
      <div class="form-actions" style="margin-top:16px;">
        <button class="btn btn-ghost" id="banner-close-btn2">Cancel</button>
        <button class="btn btn-primary" id="banner-save-btn">Save Banner</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-cropper" style="display:none">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2 class="modal-title">Crop Banner Image</h2>
        <button class="modal-close" id="cropper-close">&times;</button>
      </div>
      <div class="cropper-container">
        <img id="cropper-image" src="" style="max-width:100%">
      </div>
      <div class="form-actions" style="margin-top:20px">
        <button class="btn btn-ghost" id="cropper-cancel">Cancel</button>
        <button class="btn btn-primary" id="cropper-save">Apply Crop</button>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay" id="modal-profile-picture" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Choose Your Profile Picture</h2>
        <button class="modal-close" id="profile-pic-close">&times;</button>
      </div>
      <div class="custom-file-upload" id="upload-photo-btn">
        <input type="file" id="profile-photo-input" accept="image/*" />
        <div>📸 Click to upload a photo</div>
        <small style="color: var(--text-mute);">or choose an avatar below</small>
      </div>
      <div class="profile-avatars-grid" id="avatars-grid"></div>
      <div class="form-actions">
        <button class="btn btn-ghost" id="profile-pic-cancel">Cancel</button>
        <button class="btn btn-primary" id="profile-pic-save">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay profile-view-modal" id="modal-view-classmate" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Classmate Profile</h2>
        <button class="modal-close" id="view-classmate-close">&times;</button>
      </div>
      <div id="classmate-profile-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // ============================================================
    // MOBILE DOUBLE-TAP TO SIMULATE RIGHT-CLICK (CONTEXT MENU)
    // Feature: fast double tap on any interactive element triggers
    // a simulated "right-click" (context menu) just like file explorer.
    // Does NOT interfere with normal single-click navigation.
    // ============================================================
    (function setupMobileDoubleTapContext() {
      // Store touch timers and last tap target
      let lastTapTime = 0;
      let lastTapTarget = null;
      let pendingLongPress = null;
      const DOUBLE_TAP_DELAY = 300; // milliseconds
      
      // Helper: simulate right-click context menu on element
      function simulateContextMenu(element, clientX, clientY) {
        if (!element) return false;
        
        // Add visual flash feedback
        element.classList.add('mobile-context-triggered');
        setTimeout(() => element.classList.remove('mobile-context-triggered'), 200);
        
        // Create and dispatch a contextmenu event (right-click)
        let event;
        if (typeof PointerEvent !== 'undefined') {
          event = new PointerEvent('contextmenu', {
            bubbles: true,
            cancelable: true,
            view: window,
            clientX: clientX || 0,
            clientY: clientY || 0,
            button: 2,
            buttons: 2,
            pointerType: 'touch'
          });
        } else {
          event = new MouseEvent('contextmenu', {
            bubbles: true,
            cancelable: true,
            view: window,
            clientX: clientX || 0,
            clientY: clientY || 0,
            button: 2,
            buttons: 2
          });
        }
        
        element.dispatchEvent(event);
        
        // Also show a small toast indication (optional but helpful)
        const toastMsg = document.createElement('div');
        toastMsg.className = 'toast';
        toastMsg.textContent = '🔍 Context menu triggered (double-tap)';
        toastMsg.style.position = 'fixed';
        toastMsg.style.bottom = '80px';
        toastMsg.style.right = '16px';
        toastMsg.style.zIndex = '9999';
        toastMsg.style.background = '#2d3748';
        toastMsg.style.fontSize = '12px';
        toastMsg.style.padding = '8px 14px';
        document.body.appendChild(toastMsg);
        setTimeout(() => toastMsg.remove(), 1500);
        
        return true;
      }
      
      // Global touchstart handler for double-tap detection
      document.body.addEventListener('touchstart', function(e) {
        // Get the actual target element
        let target = e.target;
        // Climb up to find a meaningful interactive element (button, row, card, etc.)
        while (target && target !== document.body) {
          const tag = target.tagName;
          const isInteractive = target.onclick || target.hasAttribute('data-page') || 
                                target.classList?.contains('nav-item') ||
                                target.classList?.contains('student-row') ||
                                target.classList?.contains('roster-row') ||
                                target.classList?.contains('class-card') ||
                                target.classList?.contains('status-btn') ||
                                target.classList?.contains('btn') ||
                                target.classList?.contains('student-avatar-small') ||
                                target.classList?.contains('student-avatar-large') ||
                                target.getAttribute('data-student-id') ||
                                target.getAttribute('data-id') ||
                                tag === 'BUTTON' || tag === 'A' ||
                                (target.parentElement && (target.parentElement.classList?.contains('student-row') || 
                                                         target.parentElement.classList?.contains('roster-row')));
          if (isInteractive) break;
          target = target.parentElement;
          if (!target || target === document.body) break;
        }
        
        const now = Date.now();
        const timeDiff = now - lastTapTime;
        const isDoubleTap = (timeDiff < DOUBLE_TAP_DELAY && lastTapTarget === target);
        
        if (isDoubleTap && target && target !== document.body) {
          // Double tap detected! Prevent default to avoid zoom or selection
          e.preventDefault();
          e.stopPropagation();
          
          // Get touch coordinates for accurate context menu position
          const touch = e.touches[0];
          const clientX = touch ? touch.clientX : (e.clientX || 0);
          const clientY = touch ? touch.clientY : (e.clientY || 0);
          
          // Simulate right-click on the target
          simulateContextMenu(target, clientX, clientY);
          
          // Reset tap tracking to avoid triple-tap confusion
          lastTapTime = 0;
          lastTapTarget = null;
          return false;
        } else {
          // Single tap detection: store for potential double-tap
          lastTapTime = now;
          lastTapTarget = target;
          // Clear after delay to avoid memory leaks
          setTimeout(() => {
            if (lastTapTime === now) {
              lastTapTarget = null;
            }
          }, DOUBLE_TAP_DELAY);
        }
      }, { passive: false });
      
      // Also handle contextmenu event on mobile to prevent native browser menu
      // but still allow our simulated one to work
      document.body.addEventListener('contextmenu', function(e) {
        // On touch devices, long-press normally opens browser context menu.
        // We allow our double-tap to work, but we don't want to block regular
        // contextmenu on desktop - only on mobile we might want to suppress?
        // Actually, keep native behavior for long-press, double-tap is additional.
        // No suppression needed, but we add visual feedback for any contextmenu
        const target = e.target;
        if (target && target.classList) {
          target.classList.add('mobile-context-triggered');
          setTimeout(() => target.classList.remove('mobile-context-triggered'), 200);
        }
      });
      
      // Ensure that sidebar buttons and navigation still work perfectly with single tap
      // No interference — we just augment with double-tap right-click simulation.
      console.log('✅ Mobile double-tap context menu feature enabled (fast double tap = right click)');
    })();
  </script>
</body>
</html>
